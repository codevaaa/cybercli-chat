services:
  - type: web
    name: codeva-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://cybercli.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      # Keep Codic downloads disabled until platform artifacts and matching
      # checksums are configured in the Render service environment.
      - key: CODEVA_CODIC_PUBLIC_RELEASE
        value: false
      - key: ENCRYPTION_KEY
        generateValue: true
      # Cross-provider retries are disabled to prevent hidden provider charges.
      - key: LLM_AUTOMATIC_FAILOVER
        value: false
      - key: LLM_PAID_FALLBACKS
        value: false
      - key: SEEK100_API_KEY
        sync: false
      - key: SEEK100_API_KEY1
        sync: false
