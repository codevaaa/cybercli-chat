<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Codeva — Full Page Screenshot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f14; color: #ECECEC; font-family: 'Inter', -apple-system, system-ui, sans-serif; }
    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; background: #16161d; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #E8A590, #D97757); }
    .meta { font-size: 12px; color: #8b8b93; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 9px; transition: all 0.15s; }
    .btn-primary { background: #D97757; color: #fff; }
    .btn-primary:hover { background: #C4613A; }
    .btn-secondary { color: #ECECEC; border: 1px solid rgba(255,255,255,0.14); }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }
    .stage { padding: 24px; display: flex; justify-content: center; }
    #preview { max-width: 100%; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); }
    .status { padding: 40px; text-align: center; color: #8b8b93; font-size: 14px; }
    .spinner { width: 24px; height: 24px; border: 2px solid rgba(217,119,87,0.3); border-top-color: #D97757; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand"><span class="dot"></span> Codeva Screenshot</div>
    <div class="meta" id="meta">Stitching…</div>
    <button class="btn btn-secondary" id="btn-png">Download PNG</button>
    <button class="btn btn-secondary" id="btn-jpg">Download JPG</button>
    <button class="btn btn-primary" id="btn-copy">Copy</button>
  </div>
  <div class="stage">
    <div class="status" id="status"><div class="spinner"></div>Stitching your full-page screenshot…</div>
    <img id="preview" style="display:none" />
  </div>
  <canvas id="canvas" style="display:none"></canvas>
  <script src="capture.js"></script>
</body>
</html>
