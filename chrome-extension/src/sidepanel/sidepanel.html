<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codeva AI</title>
  <link rel="stylesheet" href="../styles/sidepanel.css" />
</head>
<body>
  <div id="app">
    <header class="sp-header">
      <div class="sp-brand">
        <span class="sp-logo" id="sp-logo"></span>
        <span class="sp-title">Codeva AI</span>
      </div>
      <div class="sp-head-actions">
        <button id="sp-new" class="ic-btn" title="New chat"></button>
        <button id="sp-settings" class="ic-btn" title="Settings"></button>
      </div>
    </header>

    <!-- Auth gate -->
    <div id="sp-auth" class="sp-auth" hidden>
      <span class="sp-auth-logo" id="sp-auth-logo"></span>
      <h2>Sign in to Codeva</h2>
      <p>Use your free Codeva account to unlock the assistant.</p>
      <button id="sp-signin" class="sp-btn-primary">Sign in</button>
    </div>

    <!-- Chat -->
    <main id="sp-chat" class="sp-chat">
      <div class="sp-welcome" id="sp-welcome">
        <span class="sp-welcome-logo" id="sp-welcome-logo"></span>
        <h2>How can I help?</h2>
        <p>Select text on any page for instant actions, or ask below.</p>
        <div class="sp-chips" id="sp-chips">
          <button data-q="Summarize this page">Summarize page</button>
          <button data-q="Explain the key concepts on this page">Explain page</button>
          <button data-q="Help me write a professional email">Write email</button>
          <button data-q="Review my code for bugs">Review code</button>
        </div>
      </div>
    </main>

    <footer class="sp-footer">
      <div class="sp-input-wrap">
        <textarea id="sp-input" rows="1" placeholder="Message Codeva…"></textarea>
        <button id="sp-send" class="sp-send"></button>
      </div>
      <div class="sp-model-row">
        <select id="sp-model">
          <option value="codeva-ravan-v1">Ravan · Code</option>
          <option value="gemini/gemini-2.5-flash">Sahadeva · Vision</option>
          <option value="opencode/deepseek-v4-pro">Madhav · Research</option>
          <option value="groq/llama-3.1-8b">Arjun · Fast</option>
        </select>
        <span class="sp-hint">Enter to send</span>
      </div>
    </footer>
  </div>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
