name: Build Agent Platform Desktop

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false   # one platform failing must NOT cancel the others
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20        # LTS — most compatible with electron-builder

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Install UI dependencies
        working-directory: agent-platform/ui
        run: npm install --no-audit --no-fund

      - name: Build UI
        working-directory: agent-platform/ui
        run: npm run build

      - name: Generate desktop icons
        working-directory: agent-platform/desktop
        run: node generate-icon.cjs

      - name: Install Desktop dependencies
        working-directory: agent-platform/desktop
        run: npm install --no-audit --no-fund

      - name: Build Desktop App (${{ matrix.platform }})
        working-directory: agent-platform/desktop
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-platform-${{ matrix.platform }}
          path: |
            agent-platform/desktop/dist/*.exe
            agent-platform/desktop/dist/*.dmg
            agent-platform/desktop/dist/*.AppImage
            agent-platform/desktop/dist/*.deb
          if-no-files-found: ignore

  # ── GitHub Release (runs even if some platforms failed) ──────────────────────
  release:
    needs: [build]
    if: always() && startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort || echo "no artifacts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CodeVaa Agent Platform ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## CodeVaa Agent Platform ${{ github.ref_name }}

            Autonomous multi-agent AI desktop app — 16 specialized agents, parallel execution, skills system, full project awareness.

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows | CodeVaa-Agent-Platform-*-win-x64.exe |
            | macOS | CodeVaa-Agent-Platform-*-mac-x64.dmg |
            | Linux AppImage | CodeVaa-Agent-Platform-*-linux-x64.AppImage |
            | Linux deb | CodeVaa-Agent-Platform-*-linux-amd64.deb |
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
